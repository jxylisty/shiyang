<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>图标总览</title>
<style>
  body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4faf7; color: #1f2b26; }
  h2 { font-size: 14px; margin: 18px 20px 8px; color: #55645d; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; padding: 14px 20px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; }
  .cell span { font-size: 11px; color: #64736a; }
  .big svg { color: #2e7d5b; }
  .dark { background: #16211c; }
  .dark .cell span { color: #9db3a8; }
  .dark .big svg { color: #7fc9a5; }
  .usage { display: flex; gap: 14px; padding: 14px 20px; align-items: center; }
  .tile { width: 92px; height: 92px; border-radius: 10px; background: #e8f4ee; color: #2e7d5b; display: flex; align-items: center; justify-content: center; position: relative; }
  .tile.amb { background: #fdf6e9; color: #8a5f16; }
  .tile small { position: absolute; left: 0; bottom: 0; font-size: 10px; color: #fff; background: rgba(29,74,56,.75); padding: 1px 7px; border-radius: 0 8px 0 0; }
</style>
</head>
<body>
<h2>品牌 / 导航 · 48px</h2>
<div class="row big" id="brand"></div>
<h2>场景 / 类型 · 48px</h2>
<div class="row big" id="scene"></div>
<h2>深色模式下 22px（贴近真实使用）</h2>
<div class="row dark big" id="darkrow"></div>
<h2>封面兜底 tile 效果</h2>
<div class="usage" id="tiles"></div>
<script>
const ICONS = {
  leaf: '<path d="M20 4C10.5 4.5 4.5 10.5 4 20c9.5-.5 15.5-6.5 16-16Z"/><path d="M4.5 19.5C9 15 14 10 19.5 4.5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5 15.8 15.8"/>',
  book: '<path d="M12 6.5C10.2 5.2 7.6 4.5 4 4.5v14c3.6 0 6.2.7 8 2 1.8-1.3 4.4-2 8-2v-14c-3.6 0-6.2.7-8 2Z"/><path d="M12 6.5v14"/>',
  jar: '<path d="M9 3.5h6v2.5H9Z"/><path d="M7.5 6h9v12.5a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2Z"/><path d="M7.5 9.5h9"/>',
  herb: '<path d="M12 21V7.5"/><path d="M12 11.5c0-3.1 2.1-5.3 5.4-5.5.2 3.1-2 5.4-5.4 5.5Z"/><path d="M12 16.5c0-3.1-2.1-5.3-5.4-5.5-.2 3.1 2 5.4 5.4 5.5Z"/><path d="M12 7.5c.2-1.9 1.4-3.1 3.4-3.4-.2 1.9-1.4 3.1-3.4 3.4Z"/>',
  molecule: '<path d="M12 8.5 16.2 11v5L12 18.5 7.8 16v-5Z"/><path d="M12 8.5V4.8"/><circle cx="12" cy="3.4" r="1.4"/><path d="m16.2 11 2.6-1.5"/><circle cx="20.4" cy="8.7" r="1.4"/>',
  user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.8 3.4-5.5 7-5.5s6.2 1.7 7 5.5"/>',
  tea: '<path d="M5.5 12c1.6-2.6 3.9-4 6.5-4s4.9 1.4 6.5 4"/><circle cx="12" cy="6.6" r="1"/><path d="M6 12h12l-.9 6.2a2.6 2.6 0 0 1-2.6 2.3H9.5a2.6 2.6 0 0 1-2.6-2.3Z"/>',
  dish: '<path d="M4 13h16c0 4.4-3.2 7.5-8 7.5S4 17.4 4 13Z"/><path d="M9.5 9.8c0-1.8 1.3-1.8 1.3-3.6"/><path d="M14.5 9.8c0-1.8-1.3-1.8-1.3-3.6"/>',
  throat: '<path d="M12 3.5c3.6 4.4 6 7.4 6 10.4a6 6 0 0 1-12 0c0-3 2.4-6 6-10.4Z"/><path d="M12.8 17c-2.8-.2-4.2-1.9-4.3-4.6 2.8.2 4.2 1.9 4.3 4.6Z"/>',
  eye: '<path d="M3.5 12c2.4-3.8 5.2-5.8 8.5-5.8s6.1 2 8.5 5.8c-2.4 3.8-5.2 5.8-8.5 5.8s-6.1-2-8.5-5.8Z"/><path d="M14 9.2a3.1 3.1 0 1 0 0 5.6 3.7 3.7 0 0 1 0-5.6Z"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/><path d="M19 2.5v3M17.5 4h3"/>',
  fruit: '<circle cx="12" cy="14.5" r="6"/><path d="M12 8.5V6"/><path d="M12 6.6c.2-2 1.6-3.1 3.9-3.2-.2 2-1.6 3.1-3.9 3.2Z"/>',
  season: '<path d="M20 12a8 8 0 1 1-2.3-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M12 16.5V13"/><path d="M12 13c0-1.7 1.2-2.8 3-2.9 0 1.7-1.2 2.8-3 2.9Z"/>',
  flower: '<circle cx="12" cy="12" r="1.9"/><path d="M12 10.1c-1.5-1-2.3-2.3-2.3-3.6C9.7 5 10.7 4 12 4s2.3 1 2.3 2.5c0 1.3-.8 2.6-2.3 3.6Z"/><path transform="rotate(72 12 12)" d="M12 10.1c-1.5-1-2.3-2.3-2.3-3.6C9.7 5 10.7 4 12 4s2.3 1 2.3 2.5c0 1.3-.8 2.6-2.3 3.6Z"/><path transform="rotate(144 12 12)" d="M12 10.1c-1.5-1-2.3-2.3-2.3-3.6C9.7 5 10.7 4 12 4s2.3 1 2.3 2.5c0 1.3-.8 2.6-2.3 3.6Z"/><path transform="rotate(216 12 12)" d="M12 10.1c-1.5-1-2.3-2.3-2.3-3.6C9.7 5 10.7 4 12 4s2.3 1 2.3 2.5c0 1.3-.8 2.6-2.3 3.6Z"/><path transform="rotate(288 12 12)" d="M12 10.1c-1.5-1-2.3-2.3-2.3-3.6C9.7 5 10.7 4 12 4s2.3 1 2.3 2.5c0 1.3-.8 2.6-2.3 3.6Z"/>',
};
const svg = (n, s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const cell = (n, s) => `<div class="cell">${svg(n, s)}<span>${n}</span></div>`;
const BRAND = ['leaf','search','book','jar','herb','molecule','user'];
const SCENE = ['throat','eye','moon','fruit','season','flower','tea','dish'];
document.getElementById('brand').innerHTML = BRAND.map(n => cell(n, 48)).join('');
document.getElementById('scene').innerHTML = SCENE.map(n => cell(n, 48)).join('');
document.getElementById('darkrow').innerHTML = [...BRAND, ...SCENE].map(n => cell(n, 22)).join('');
document.getElementById('tiles').innerHTML =
  `<div class="tile">${svg('tea', 40)}<small>茶饮</small></div>` +
  `<div class="tile amb">${svg('dish', 40)}<small>药膳</small></div>` +
  `<div class="tile">${svg('herb', 40)}</div>` +
  `<div class="tile">${svg('leaf', 40)}</div>`;
</script>
</body>
</html>
